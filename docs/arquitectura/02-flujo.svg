<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="t d"><title id="t">Flujo de una recomendación en InvestWise</title><desc id="d">Ocho etapas desde el texto del usuario hasta la explicación, con el conjunto difuso del horizonte en el fitness y el de la capacidad de absorción dentro del cromosoma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#837d6f"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5c5a"/></marker><marker id="arrow-caution" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e4f0a"/></marker></defs><rect width="1400" height="1180" fill="#f6f4ee"/><text x="60" y="56" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="500" fill="#1c1a17" text-anchor="start">InvestWise · Flujo de una recomendación</text><text x="60" y="82" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#55514a" text-anchor="start">De un texto libre a un portafolio explicado, en 8 etapas</text><rect x="60" y="110" width="620" height="108" rx="4" fill="#fcfbf8" stroke="#dad5c9" stroke-width="1"/><rect x="60" y="110" width="6" height="108" rx="1" fill="#837d6f"/><circle cx="94" cy="140" r="15" fill="#837d6f"/><text x="94" y="145" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">1</text><text x="120" y="146" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">El usuario describe su situación</text><text x="666" y="146" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">frontend</text><text x="84" y="174" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Texto libre, sin formularios: «Tengo S/ 5,000 de mis S/ 20,000,</text><text x="84" y="191" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">no me gusta arriesgar y no los necesito en unos 3 años»</text><rect x="720" y="110" width="620" height="108" rx="4" fill="#fcfbf8" stroke="#dad5c9" stroke-width="1"/><rect x="720" y="110" width="6" height="108" rx="1" fill="#4f6b8e"/><circle cx="754" cy="140" r="15" fill="#4f6b8e"/><text x="754" y="145" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">2</text><text x="780" y="146" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">IA generativa interpreta</text><text x="1326" y="146" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">ai/generative</text><text x="744" y="174" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Extrae monto, horizonte, perfil de riesgo, ahorros y colchón con evidencia.</text><text x="744" y="191" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Si falta algo crítico → UNA pregunta de aclaración (nunca supone).</text><path d="M680,164 L720,164" fill="none" stroke="#837d6f" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1020,218 L1020,238 L360,238 L360,218" fill="none" stroke="#4f6b8e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="571.41" y="230.5" width="257.18" height="19.5" rx="3" fill="#f6f4ee"/><text x="700" y="243" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#4f6b8e" text-anchor="middle">bucle de aclaración: pregunta → respuesta</text><rect x="60" y="270" width="620" height="116" rx="4" fill="#fcfbf8" stroke="#dad5c9" stroke-width="1"/><rect x="60" y="270" width="6" height="116" rx="1" fill="#1f5c5a"/><circle cx="94" cy="300" r="15" fill="#1f5c5a"/><text x="94" y="305" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">3</text><text x="120" y="306" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">Estimación bayesiana del mercado</text><text x="666" y="306" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">ai/uncertainty/bayesian</text><text x="84" y="334" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">5 series reales (BCRP, SBS) → retornos mensuales.</text><text x="84" y="351" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">μ: prior del Anexo A + datos (actualización conjugada).</text><text x="84" y="368" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">σ, correlaciones y tendencia de cada categoría.</text><text x="376" y="408" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#55514a" text-anchor="start" font-style="italic">precalculado desde data/market/ (no depende del usuario)</text><rect x="720" y="270" width="620" height="116" rx="4" fill="#fcfbf8" stroke="#dad5c9" stroke-width="1"/><rect x="720" y="270" width="6" height="116" rx="1" fill="#1f5c5a"/><circle cx="754" cy="300" r="15" fill="#1f5c5a"/><text x="754" y="305" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">4</text><text x="780" y="306" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">Lógica difusa sobre el perfil</text><text x="1326" y="306" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">ai/uncertainty/fuzzy</text><text x="744" y="334" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Horizonte (Sugeno): «unos 3 años» → m_H → λ efectiva</text><text x="744" y="351" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Absorción (Mamdani, sin desfuzzificar): ahorro comprometido</text><text x="744" y="368" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">y meses de colchón → conjunto difuso μ_CA</text><path d="M1020,218 L1020,268" fill="none" stroke="#837d6f" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="438" width="620" height="116" rx="4" fill="#fcfbf8" stroke="#dad5c9" stroke-width="1"/><rect x="60" y="438" width="6" height="116" rx="1" fill="#a87b24"/><circle cx="94" cy="468" r="15" fill="#a87b24"/><text x="94" y="473" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">5</text><text x="120" y="474" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">Reglas de contexto</text><text x="666" y="474" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">ai/context</text><text x="84" y="502" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Panorama político, estabilidad macro, precedente, tendencia.</text><text x="84" y="519" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">RC1–RC7 ajustan el retorno (μ') y el riesgo (Σ') por categoría,</text><text x="84" y="536" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">con un tope de influencia: el contexto nunca domina a los datos.</text><path d="M360,386 L360,436" fill="none" stroke="#837d6f" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="606" width="1280" height="250" rx="4" fill="#fcfbf8" stroke="#9a4a3a" stroke-width="1.6"/><rect x="60" y="606" width="6" height="250" rx="1" fill="#9a4a3a"/><circle cx="94" cy="636" r="15" fill="#9a4a3a"/><text x="94" y="641" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">6</text><text x="120" y="642" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">Algoritmo genético: busca el mejor portafolio para ESE usuario en ESE contexto</text><text x="1326" y="642" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">ai/heuristic</text><text x="84" y="678" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#55514a" text-anchor="start">Cromosoma (cada individuo de la población):</text><rect x="84" y="690" width="106" height="40" rx="4" fill="#edeae2" stroke="#837d6f" stroke-width="1"/><text x="137" y="715" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="middle">w1 acciones</text><rect x="196" y="690" width="106" height="40" rx="4" fill="#edeae2" stroke="#837d6f" stroke-width="1"/><text x="249" y="715" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="middle">w2 mixtos</text><rect x="308" y="690" width="106" height="40" rx="4" fill="#edeae2" stroke="#837d6f" stroke-width="1"/><text x="361" y="715" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="middle">w3 deuda</text><rect x="420" y="690" width="106" height="40" rx="4" fill="#edeae2" stroke="#837d6f" stroke-width="1"/><text x="473" y="715" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="middle">w4 bonos</text><rect x="532" y="690" width="106" height="40" rx="4" fill="#edeae2" stroke="#837d6f" stroke-width="1"/><text x="585" y="715" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="middle">w5 depósito</text><rect x="658" y="690" width="150" height="40" rx="4" fill="#e4eeeb" stroke="#1f5c5a" stroke-width="1.8"/><text x="733" y="710" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1f5c5a" text-anchor="middle">c  · gen difuso</text><text x="733" y="725" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#1f5c5a" text-anchor="middle">nivel de absorción</text><text x="84" y="752" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#55514a" text-anchor="start">Σw = 1 · 5 % ≤ w ≤ 40 %  ·  c ∈ [0, 1]</text><text x="840" y="678" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#55514a" text-anchor="start">Función de aptitud (fitness):</text><rect x="840" y="690" width="476" height="62" rx="4" fill="#edeae2" stroke="#dad5c9" stroke-width="1"/><text x="854" y="714" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#1c1a17" text-anchor="start">Σ wᵢ·μ'ᵢ  −  λ_ef·σ'(P)</text><text x="854" y="738" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#1c1a17" text-anchor="start">−  φ·max(0, σ' − σ_max(c))²  +  κ·μ_CA(c)</text><text x="84" y="786" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Población de 80 portafolios · selección por torneo · cruce aritmético · mutación gaussiana · elitismo</text><text x="84" y="804" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Se detiene al converger (sin mejora en 25 generaciones) · misma semilla → mismo resultado</text><text x="84" y="822" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Resultado: los 5 pesos, el gen c, el desglose del puntaje y la curva de convergencia</text><path d="M1200,386 L1200,688" fill="none" stroke="#1f5c5a" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="1131.6" y="488" width="136.8" height="20" rx="3" fill="#f6f4ee"/><text x="1200" y="501" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1f5c5a" text-anchor="middle">λ efectiva → FITNESS</text><path d="M860,386 L860,470 L733,470 L733,688" fill="none" stroke="#1f5c5a" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="748.12" y="528" width="161.76" height="20" rx="3" fill="#f6f4ee"/><text x="829" y="541" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1f5c5a" text-anchor="middle">μ_CA → CROMOSOMA (gen c)</text><path d="M360,554 L360,604" fill="none" stroke="#837d6f" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="304.08" y="572" width="111.84" height="20" rx="3" fill="#f6f4ee"/><text x="360" y="585" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#55514a" text-anchor="middle">μ', Σ' ajustados</text><rect x="60" y="900" width="620" height="116" rx="4" fill="#fcfbf8" stroke="#dad5c9" stroke-width="1"/><rect x="60" y="900" width="6" height="116" rx="1" fill="#4f6b8e"/><circle cx="94" cy="930" r="15" fill="#4f6b8e"/><text x="94" y="935" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">7</text><text x="120" y="936" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">IA generativa explica</text><text x="666" y="936" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">ai/generative</text><text x="84" y="964" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Recibe SOLO cifras calculadas: reparto en soles, escenarios,</text><text x="84" y="981" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">efecto del horizonte y de la absorción, supuestos.</text><text x="84" y="998" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Se valida cada número; si falla → plantilla determinista.</text><rect x="720" y="900" width="620" height="116" rx="4" fill="#fcfbf8" stroke="#dad5c9" stroke-width="1"/><rect x="720" y="900" width="6" height="116" rx="1" fill="#837d6f"/><circle cx="754" cy="930" r="15" fill="#837d6f"/><text x="754" y="935" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcfbf8" text-anchor="middle">8</text><text x="780" y="936" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#1c1a17" text-anchor="start">Interfaz gráfica</text><text x="1326" y="936" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#55514a" text-anchor="end">frontend</text><text x="744" y="964" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Portafolio con montos en S/, explicación y supuestos.</text><text x="744" y="981" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Panel de contexto (Adverso / Neutral / Favorable) y</text><text x="744" y="998" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">detalle técnico: pertenencias, μ_CA con c y centroide, reglas.</text><path d="M360,856 L360,898" fill="none" stroke="#837d6f" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M680,958 L720,958" fill="none" stroke="#837d6f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="60" y="1060" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1a17" text-anchor="start">Módulos del curso:</text><rect x="210" y="1048" width="14" height="14" rx="2" fill="#4f6b8e" stroke="#4f6b8e" stroke-width="1"/><text x="232" y="1060" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">IA generativa</text><rect x="430" y="1048" width="14" height="14" rx="2" fill="#1f5c5a" stroke="#1f5c5a" stroke-width="1"/><text x="452" y="1060" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Razonamiento bajo incertidumbre</text><rect x="650" y="1048" width="14" height="14" rx="2" fill="#9a4a3a" stroke="#9a4a3a" stroke-width="1"/><text x="672" y="1060" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Algoritmo heurístico</text><rect x="870" y="1048" width="14" height="14" rx="2" fill="#a87b24" stroke="#a87b24" stroke-width="1"/><text x="892" y="1060" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">Reglas de contexto</text><path d="M1090,1055 L1132,1055" fill="none" stroke="#1f5c5a" stroke-width="2" marker-end="url(#arrow-accent)"/><text x="1142" y="1060" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1c1a17" text-anchor="start">conjunto difuso → AG</text><text x="60" y="1094" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#55514a" text-anchor="start" font-style="italic">El conjunto del horizonte actúa en la EVALUACIÓN (fitness) y el de la capacidad de absorción vive en la CADENA GENÉTICA (gen c): lo que pidió el docente.</text></svg>
